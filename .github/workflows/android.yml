# Builds the Gloop Android app (Capacitor wrapper around https://gloop.novas.my plus native
# plugins) into an installable APK, uploaded as the `gloop-android` artifact and published as
# gloop.apk on the `android-latest` release, so a phone can download it from a fixed link:
# https://github.com/mufanees/Workout-tracker/releases/latest/download/gloop.apk
# Debug builds are signed with the committed android/app/debug.keystore so each one installs over
# the last. A release APK is built too when the signing secrets exist:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - 'src/native.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write # the android-latest release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # its default list includes the retired 'tools' package, which now fails
          packages: 'platform-tools'

      - name: Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      # webDir (dist) is only the fallback the app ships; the app itself loads the live site.
      - name: Build the web app
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      # ML Kit GenAI Prompt is a beta artifact: if it can't be resolved or its API moved, build
      # again without on-device AI (the plugin then reports 'unavailable') rather than fail.
      - name: Debug APK
        id: debug
        working-directory: android
        run: |
          chmod +x gradlew
          if ./gradlew assembleDebug --stacktrace; then
            echo "genai=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Build with ML Kit GenAI failed; building without on-device AI (-Pgloop.genai=false)"
            ./gradlew assembleDebug -Pgloop.genai=false --stacktrace
            echo "genai=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease -Pgloop.genai=${{ steps.debug.outputs.genai }} --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Name the APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/gloop-${{ github.run_number }}-debug.apk"
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/gloop-${{ github.run_number }}-release.apk"
          fi
          echo "On-device AI in this build: ${{ steps.debug.outputs.genai }}" > out/BUILD.txt
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: gloop-android
          path: out/
          if-no-files-found: error
          retention-days: 30

      # A fixed place to download from on a phone (artifacts are zipped and need the desktop site).
      - name: Publish to the android-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/gloop-${{ github.run_number }}-release.apk ]; then
            cp out/gloop-${{ github.run_number }}-release.apk out/gloop.apk
          else
            cp out/gloop-${{ github.run_number }}-debug.apk out/gloop.apk
          fi
          notes="Build #${{ github.run_number }} from ${GITHUB_SHA::7}. On-device AI: ${{ steps.debug.outputs.genai }}. Download gloop.apk below, open it, and allow installs from your browser if Android asks."
          if gh release view android-latest > /dev/null 2>&1; then
            gh release edit android-latest --title "Gloop for Android" --notes "$notes" --latest
          else
            gh release create android-latest --title "Gloop for Android" --notes "$notes" --target "$GITHUB_SHA" --latest
          fi
          gh release upload android-latest out/gloop.apk --clobber
